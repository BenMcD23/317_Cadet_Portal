# The components shared with the SMS site must match its main branch (see
# scripts/shared-files.mjs). Not a required check: while a change to a shared
# file is open in both repos this is red until the site's side merges, and
# that shouldn't block anything. The weekly run catches a change made on the
# site's side, which no pull request here would otherwise notice.
name: Shared files

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: shared-files-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Shared components match the SMS site's main
        run: npm run shared:check
